- scenario_id: C3-S05-transfer-promotion
  title: distinct unfamiliar H0 transfer proves M3 eligibility
  node_id: CN-A-evidence-to-character-judgment
  before:
    mastery: M2
    automation: A2
    verified_complexity_band: C2
    mastery_evidence_strength: strong
  evidence:
    attempts:
      - {material_family: modern-biography, task_type: TT-character-analysis, variant: VAR-1, familiarity: unfamiliar, transfer_probe: true, complexity: C2, hint: H0, observation: positive, independence: independent}
      - {material_family: classical-biography, task_type: TT-classical-character, variant: VAR-2, familiarity: unfamiliar, transfer_probe: true, complexity: C2, hint: H0, observation: positive, independence: independent}
  expected:
    mastery:
      action: upgrade
      from: M2
      to: M3
      evidence_strength: strong
    automation:
      action: hold
      to: A2
    complexity:
      action: hold
      to: C2
    notes:
      - M3 is produced by stable transfer across meaningfully different contexts, not by C4 complexity.

- scenario_id: C3-S06-high-complexity-failure-no-downgrade
  title: one C4 failure does not erase stable C2 mastery
  node_id: CN-A-integrate-multiple-sources
  before:
    mastery: M2
    automation: A2
    verified_complexity_band: C2
    mastery_evidence_strength: strong
  evidence:
    attempts:
      - {complexity: C4, familiarity: unfamiliar, transfer_probe: true, hint: H0, observation: negative, independence: independent}
  expected:
    mastery:
      action: hold
      to: M2
      confidence_effect: none
    complexity:
      action: hold
      to: C2
    notes:
      - Record a higher-complexity gap; do not downgrade lower-band mastery.

- scenario_id: C3-S07-recent-comparable-regression
  title: repeated recent C2 contradictions can downgrade an old M2 estimate
  node_id: CN-A-translate-classical-sentence-accurately
  before:
    mastery: M2
    automation: A2
    verified_complexity_band: C2
    mastery_evidence_strength: moderate
    last_verified_age: old
  evidence:
    attempts:
      - {material: MAT-new-1, variant: VAR-1, complexity: C2, hint: H0, observation: negative, independence: independent, prerequisite_blocked: false}
      - {material: MAT-new-2, variant: VAR-2, complexity: C2, hint: H1, observation: mixed, independence: independent, prerequisite_blocked: false}
      - {material: MAT-new-3, variant: VAR-3, complexity: C1, hint: H0, observation: negative, independence: independent, prerequisite_blocked: false}
  expected:
    mastery:
      action: downgrade
      from: M2
      to: M1
      evidence_strength: moderate
    automation:
      action: downgrade_or_verify
      from: A2
      to: A1
    complexity:
      action: downgrade
      from: C2
      to: C1
    notes:
      - Recent comparable contradictions across distinct contexts outweigh stale moderate evidence.

- scenario_id: C3-S08-prerequisite-blocked-downstream
  title: lexical failure blocks translation evidence rather than creating downstream negative evidence
  node_id: CN-A-translate-classical-sentence-accurately
  before:
    mastery: M2
    automation: A1
    verified_complexity_band: C2
  evidence:
    attempt:
      classical_word_sense:
        observation: negative
        role: prerequisite
      translation:
        observation: not_observed
        role: primary_target
      final_answer_correctness: 0
  expected:
    mastery:
      action: no_evidence
      to: M2
    notes:
      - Update the prerequisite node, not translation mastery, until translation is validly observable.

