# C3 representative evidence→profile scenarios.
# These are semantic fixtures, not production learner writes.

- scenario_id: C3-S01-zhouyafu-legacy-character
  title: legacy familiar guided character reasoning remains low-confidence
  node_id: CN-A-evidence-to-character-judgment
  before:
    mastery: null
    automation: null
    verified_complexity_band: null
  evidence:
    attempt_ids: [ATT-legacy-zhouyafu-45-01]
    legacy_reconstructed: true
    familiarity: familiar
    complexity: C2
    observation: positive
    independence: unknown
    hint_level: null
    primary_error: E
  expected:
    mastery:
      action: initialize
      to: M1
      evidence_strength: weak
    automation:
      action: no_evidence
      to: null
      evidence_strength: none
    complexity:
      action: initialize
      to: C2
      evidence_strength: weak
    notes:
      - The historical reasoning direction is useful evidence, but unknown hint dependence blocks M2/A2 claims.
      - Legacy-only evidence cannot establish strong confidence or M3/A3.

- scenario_id: C3-S02-guided-repair
  title: H3 second attempt repairs reasoning but does not prove independent mastery
  node_id: CN-A-evidence-to-character-judgment
  before:
    mastery: M1
    automation: A1
    verified_complexity_band: C2
  evidence:
    attempt_ids: [ATT-synthetic-character-01, ATT-synthetic-character-02]
    sequence:
      - hint: H0
        observation: mixed
        independence: independent
        reasoning: 1
      - hint: H3
        observation: positive
        independence: partial
        reasoning: 2
        delta: resolved
  expected:
    mastery:
      action: hold
      to: M1
      confidence_effect: increase
    automation:
      action: hold
      to: A1
      confidence_effect: increase
    complexity:
      action: hold
      to: C2
    recommendation_signal: repeat same canonical operation on a distinct C2 context with H0/H1

- scenario_id: C3-S03-independent-routine-promotion
  title: distinct independent routine successes promote M1 to M2
  node_id: CN-A-explain-comparison-significance
  before:
    mastery: M1
    automation: A1
    verified_complexity_band: C2
  evidence:
    attempts:
      - {material: MAT-A, task_type: TT-comparison-function, variant: VAR-A, familiarity: unfamiliar, complexity: C2, hint: H0, observation: positive, independence: independent}
      - {material: MAT-B, task_type: TT-comparison-function, variant: VAR-B, familiarity: unfamiliar, complexity: C2, hint: H1, observation: positive, independence: independent}
      - {material: MAT-C, task_type: TT-comparison-function, variant: VAR-C, familiarity: partially_familiar, complexity: C2, hint: H0, observation: positive, independence: independent}
  expected:
    mastery:
      action: upgrade
      from: M1
      to: M2
      evidence_strength: moderate
    automation:
      action: upgrade
      from: A1
      to: A2
      evidence_strength: moderate
    complexity:
      action: hold
      to: C2
      evidence_strength: moderate
    notes:
      - Item count is not the cause of promotion; diversity and independence are.

