    automation: A2
    verified_complexity_band: C2
  evidence:
    attempt:
      reasoning: 2
      evidence_selection: 2
      written_expression: 0
      answer_correctness: 1
      target_observation: positive
      independence: independent
      primary_error: E
  expected:
    mastery:
      action: hold
      to: M2
      confidence_effect: increase
    error_pattern:
      action: candidate
      code: E
    notes:
      - Reasoning Profile must not be downgraded because expression output is weak; expression-related node receives the negative evidence.

