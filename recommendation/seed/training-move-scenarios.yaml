    primary_target_node_ids: [CN-A-evidence-to-character-judgment]
    priority_class: P1_high
    material_familiarity_target: unfamiliar
    transfer_probe_required: true
    complexity_band_target: C2
    max_intended_hint_level: H0
    excluded_variant_group_ids: [VAR-recent-character-family]
  rationale: >-
    More familiar routine character questions add little information; the missing evidence is generalization.

