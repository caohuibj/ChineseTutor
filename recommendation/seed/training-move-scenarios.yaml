# F1 representative TrainingMove scenarios.
# Synthetic unless explicitly marked as reconstructed from current project evidence.

- scenario_id: F1-zhouyafu-fade-character-reasoning
  source: current_project_reconstructed
  profile:
    node_id: CN-A-evidence-to-character-judgment
    mastery: M1
    automation: A1
    verified_complexity: C2
    mastery_evidence: weak
    primary_error_pattern: E
  recent_evidence:
    - familiar Zhou Yafu task showed correct special-context reasoning but historical hint independence is uncertain
    - comparison task showed correct contrast facts but incomplete effect explanation
  recommendation:
    move_type: fade_scaffold
    primary_target_node_ids: [CN-A-evidence-to-character-judgment]
    priority_class: P1_high
    reason_codes: [mastery_gap, automation_gap, strategy_fade, dependency_unlock]
    preferred_task_types: [TT-character-analysis]
    material_familiarity_target: unfamiliar
    complexity_band_target: C2
    max_intended_hint_level: H1
    success: two distinct C2 materials with positive independent evidence-to-character explanation at H0/H1
  rationale: >-
    Direction is established, so reteaching character labels is low value. Keep reasoning demand stable,
    remove the key-question scaffold, and verify independent evidence→explanation→judgment production.

- scenario_id: F1-same-task-novice-character
  source: synthetic
  profile:
    character_reasoning: M0
    text_location: M0
  recommendation:
    move_type: establish
    primary_target_node_ids: [CN-A-locate-relevant-information]
    secondary_target_node_ids: [CN-A-evidence-to-character-judgment]
    priority_class: P0_blocking
    complexity_band_target: C1
    max_intended_hint_level: H4
    material_familiarity_target: familiar
  rationale: >-
    A full independent character-analysis item would mostly measure inability to locate evidence.
    Establish the blocker first even though the eventual TaskType is the same.

- scenario_id: F1-same-task-transfer-ready-character
  source: synthetic
