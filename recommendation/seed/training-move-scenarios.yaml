- scenario_id: F1-central-bottleneck-outranks-isolated-low-score
  source: synthetic
  candidates:
    - node: title-function-task-underlying
      state: M0
      graph_unlock_value: low
      gaokao_relevance: supporting
    - node: CN-S-evidence-explanation-conclusion
      state: M1/A1
      graph_unlock_value: high
      gaokao_relevance: core
  selected:
    node: CN-S-evidence-explanation-conclusion
    move_type: fade_scaffold
    priority_class: P1_high
  rationale: >-
    The shared evidence-warrant strategy affects character, theme, evaluation and argumentative expression,
    so its causal leverage outranks an isolated lower mastery label.

- scenario_id: F1-review-cheap-before-reteach
  source: synthetic
  profile:
    node: CN-K-classical-content-word-meaning
    mastery: M2
    mastery_evidence: moderate
    forgetting_risk: high
    review_status: due
  recommendation:
    move_type: review
    priority_class: P3_maintenance
    complexity_band_target: C1
    max_intended_hint_level: H0
    success: one short retrieval/context probe succeeds independently
  next_if_success: stop review; preserve state/confidence per C3
  next_if_failure: recompute toward diagnose/establish depending on error

- scenario_id: F1-expression-gap-micro-writing-not-full-essay
  source: synthetic
  profile:
    reasoning: M2
    written_expression: M1
    error_pattern: E
  recommendation:
    move_type: scaffolded_practice
    primary_target_node_ids: [CN-A-revise-sentence-minimally]
    priority_class: P1_high
    response_mode_preference: written
    complexity_vector_constraints:
      reasoning_depth: {min: 1, max: 2}
      expression_load: {min: 1, max: 2}
    max_intended_hint_level: H2
    success: convert correct oral/arrow logic into two concise scoreable written answers without adding new reasoning content
  rationale: do not spend a full essay when the evidence need is local written conversion

