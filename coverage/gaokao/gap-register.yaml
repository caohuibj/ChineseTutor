architecture_verdict: >-
  The B1–G1 entity model is expressive enough for all representative demands audited in I1.
  The remaining failures are graph-population, TaskType-inventory and authentic-material coverage gaps;
  no new top-level entity type, learner-state axis, hint model or complexity dimension is required by this corpus.
