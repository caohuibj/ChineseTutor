task_types:
  - task_type_id: TT-character-analysis
    name_zh: 人物形象分析题
    domain: MRD
    subdomain: MRD.narrative
    status: active
    definition: 基于人物言行、事件、情境等证据作人物特征判断并说明理由。
    recognition_signals: 分析/概括人物形象、性格、品质，结合内容说明。
    core_question: 哪些文本事实在什么情境下足以支持怎样的人物判断？
    output_skeleton: 人物特征 + 关键证据 + 证据为何足以支持该判断。
    self_checks: 是否只有品质标签？是否有文本事实？是否写出证据到判断的理由？
    boundaries: 不等于仅概括事件，也不等于描写方法识别。
    default_knowledge_node_ids: []
    default_ability_node_ids: [CN-A-evidence-to-character-judgment]
    recommended_strategy_node_ids: [CN-S-evidence-explanation-conclusion]

  - task_type_id: TT-typical-event-characterization
    name_zh: 典型事件与选材作用题
    domain: MRD
    subdomain: MRD.narrative
    status: active
    definition: 分析某事件为什么具有辨识度并能集中表现人物/主题。
    recognition_signals: 为什么写这件事、为什么选这一小事、事件有何典型性/作用。
    core_question: 这个事件中的特殊情境和关键选择为什么比普通事件更能证明人物/中心？
    output_skeleton: 特殊情境 + 关键选择/差异 + 人物/中心意义。
    self_checks: 是否说明特殊性？是否解释人物选择？是否回扣表现效果？
    boundaries: 不等于普通事件概括。
    default_knowledge_node_ids: []
    default_ability_node_ids: [CN-A-evidence-to-character-judgment]
    recommended_strategy_node_ids: [CN-S-special-context-key-choice-significance]

  - task_type_id: TT-comparison-foil-function
    name_zh: 对比与衬托作用题
    domain: MRD
    subdomain: MRD.structure
    status: active
    definition: 建立共同维度比较两个对象，并解释差异如何突出主要对象、人物或主旨。
    recognition_signals: 对比、衬托、写另一对象有什么作用。
    core_question: 比什么、差异是什么、这种差异突出谁的什么特点？
    output_skeleton: 比较维度 + 双方证据/差异 + 突出对象与意义。
    self_checks: 是否只说“形成对比”？是否具体写出差异和突出效果？
    boundaries: 不等于只列两个对象事实。
    default_knowledge_node_ids: []
    default_ability_node_ids: [CN-A-establish-comparison-dimension, CN-A-explain-comparison-significance]
    recommended_strategy_node_ids: []
