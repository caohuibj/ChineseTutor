# B1 executable-style examples (documentation fixture, not runtime schema)
# These records demonstrate the canonical contract across major domains.

- node_id: CN-K-LIT-memoir-genre-features
  name_zh: 回忆性散文的文体特征
  node_type: knowledge
  domain: LIT
  subdomain: genre
  definition: >-
    回忆性散文通常以第一人称回望真实经历，通过选择性记忆、叙事与抒情相结合来表现人物、事件及“现在的我”对过去的理解。
  observable_success: >-
    能识别并解释主要文体特征，并与传记、小说等相邻体裁作有依据的区分。
  scope_in: 视角、材料选择、写作目的、表达方式等稳定体裁特征。
  scope_out: 对某一具体文本作最终文体判定；该操作属于能力节点。
  parent_node_id: null
  gaokao_relevance: supporting
  status: draft
  aliases_zh: [回忆性散文特征]
  source_basis: [现有人物叙事学习设计]

- node_id: CN-A-LIT-judge-genre-from-evidence
  name_zh: 根据文本证据判断文体
  node_type: ability
  domain: LIT
  subdomain: genre
  definition: >-
    调用体裁知识，从叙事视角、材料组织、表达方式与写作目的等文本证据判断文本的文体属性，并说明理由。
  observable_success: >-
    面对陌生文本时，不只贴文体标签，能够列出相关证据并解释其与文体特征的对应关系。
  scope_in: 回忆性散文、传记、小说等体裁辨析。
  scope_out: 仅背诵体裁定义；单纯分析人物品质。
  parent_node_id: null
  gaokao_relevance: supporting
  status: draft
  aliases_zh: [文体辨析]
  source_basis: [现有人物叙事学习设计]

- node_id: CN-A-META-evidence-to-character-judgment
  name_zh: 由事实、情境与选择推断人物特征
  node_type: ability
  domain: META
  subdomain: evidence
  definition: >-
    从人物的言行、事件与所处特殊情境出发，解释其关键选择为何能支持某项相对稳定的人物特征判断。
  observable_success: >-
    在现代文或文言陌生材料中，能给出事实证据并显性完成“证据为什么足以支持人物判断”的推理。
  scope_in: 人物形象、人物评价、典型事件中的人格判断。
  scope_out: 文言词句解码；仅概括事件；无证据的价值判断。
  parent_node_id: null
  gaokao_relevance: core
  status: draft
  aliases_zh: [人物形象分析, 文言人物形象]
  source_basis: [周亚夫军细柳训练记录, 人物叙事单元]

- node_id: CN-S-MRD-special-context-key-choice-significance
  name_zh: 特殊情境—关键选择—意义链
  node_type: strategy
  domain: MRD
  subdomain: narrative
  definition: >-
    先识别事件中的特殊压力或限制，再找人物关键选择，与常态或他人选择形成差异，最后解释这种差异如何集中证明稳定品质并服务人物或主旨。
  observable_success: >-
    面对“为什么选这件事/为什么这一小事典型”等不同题目，能够主动调用该链条组织分析，而非只评价事件“重要”。
  scope_in: 典型事件、人物选择、选材作用；可迁移到写作选材反思。
  scope_out: 所有事件概括；固定答案句式。
  parent_node_id: null
  gaokao_relevance: supporting
  status: draft
  aliases_zh: [典型事件为什么典型]
  source_basis: [知识与方法卡：典型事件为什么“典型”]

- node_id: CN-A-CLA-infer-contextual-word-sense
  name_zh: 根据语境判断文言词语义项
  node_type: ability
  domain: CLA
  subdomain: lexicon
  definition: >-
    在词义知识网络基础上，根据搭配、句法和上下文事件关系选择或推断当前文言语境中的合理义项。
  observable_success: >-
    在陌生短篇中能给出与句意一致的词义判断，并在需要时说明语境依据。
  scope_in: 实词语境义、一词多义义项选择、部分活用后语义理解。
  scope_out: 单纯背诵词条；虚词功能；完整句子翻译。
  parent_node_id: null
  gaokao_relevance: core
  status: draft
  aliases_zh: [文言实词语境义]
  source_basis: [现有文言教材与课外迁移设计]

- node_id: CN-A-CLA-translate-sentence-accurately
  name_zh: 准确翻译文言句子
  node_type: ability
  domain: CLA
  subdomain: translation
  definition: >-
    在落实关键词、识别句法并补足必要省略的基础上，把文言句子转换为语义准确、关系清楚且符合现代汉语表达习惯的句子。
  observable_success: >-
    关键词义、逻辑关系、人物/对象、特殊句式均落实，译句通顺且无关键语义遗漏。
  scope_in: 单句或短句翻译。
  scope_out: 全文概括；只背固定译文。
  parent_node_id: null
  gaokao_relevance: core
  status: draft
  aliases_zh: [文言翻译]
  source_basis: [Project Instruction, 文言训练体系]

- node_id: CN-S-CLA-classical-translation-five-step
  name_zh: 文言翻译五步法
  node_type: strategy
  domain: CLA
  subdomain: translation
  definition: 圈关键词 → 逐词落实 → 调整句式 → 补省略 → 通读校验。
  observable_success: >-
    能在陌生文言句中主动执行步骤并通过校验发现关键词遗漏、对象错位或现代汉语不通顺问题。
  scope_in: 文言翻译及译句复核。
  scope_out: 固定篇目的译文记忆。
  parent_node_id: null
  gaokao_relevance: supporting
  status: draft
  aliases_zh: [圈关键词逐词落实调整句式补省略通读校验]
  source_basis: [Project Instruction]

- node_id: CN-A-POE-link-image-to-emotion
  name_zh: 解释意象、画面与情感之间的关系
  node_type: ability
  domain: POE
  subdomain: emotion
  definition: >-
    从诗中具体景物、事件、人物状态和关键词出发，还原画面特征，并解释这些证据如何形成情绪方向和情感对象。
  observable_success: >-
    不只给出“思乡/悲伤/喜悦”等情感标签，而能用诗中证据解释情感判断。
  scope_in: 意象、意境、情景关系、思想感情。
  scope_out: 只背意象固定象征义；默写。
  parent_node_id: null
  gaokao_relevance: core
  status: draft
  aliases_zh: [诗词思想感情, 意象与意境分析]
  source_basis: [Project Instruction, 古诗词题型地图]

- node_id: CN-A-WRT-select-typical-material
  name_zh: 选择能集中表现中心的典型材料
  node_type: ability
  domain: WRT
  subdomain: material
  definition: >-
    根据题目限制和中心问题，在候选经历或材料中选择具有关键冲突、情境压力、人物选择或辨识度的内容，使有限篇幅高效服务中心。
  observable_success: >-
    能比较多个候选素材并解释最终选择为什么更能服务中心，而不是只因事件宏大或熟悉而选择。
  scope_in: 叙事作文选材、素材迁移、典型事件选择。
  scope_out: 细节展开；全文结构；单纯列素材。
  parent_node_id: null
  gaokao_relevance: core
  status: draft
  aliases_zh: [作文选材与典型事件]
  source_basis: [人物故事会写作任务, 周亚夫典型事件训练迁移]

- node_id: CN-A-WRT-parse-prompt-constraints
  name_zh: 解析写作题目的任务与限制
  node_type: ability
  domain: WRT
  subdomain: prompt
  definition: >-
    从题目、材料和任务说明中识别对象、情境、核心限制、文体/身份/目的要求及不可遗漏条件。
  observable_success: >-
    能把题目约束转换成简洁检查清单，并据此排除偏题立意或不合任务的材料。
  scope_in: 命题作文、材料作文、任务型写作、微写作。
  scope_out: 形成最终中心观点；全文论证。
  parent_node_id: null
  gaokao_relevance: core
  status: draft
  aliases_zh: [作文审题]
  source_basis: [现有作文能力节点, 高考写作任务]

- node_id: CN-A-LAN-revise-sentence-logic
  name_zh: 诊断并最小修改句子逻辑或语法问题
  node_type: ability
  domain: LAN
  subdomain: revision
  definition: >-
    判断句子在成分、搭配、指代或逻辑关系上的问题，并在尽量保留原意的前提下进行最小有效修改。
  observable_success: >-
    修改后句意、语法和逻辑成立；必要时能说明原句问题所在；不通过无关大幅改写规避诊断。
  scope_in: 病句修改、句子准确性、局部表达修正。
  scope_out: 全段风格重写；文学赏析。
  parent_node_id: null
  gaokao_relevance: supporting
  status: draft
  aliases_zh: [语病与句子表达]
  source_basis: [现有能力地图, 语言运用题型]

- node_id: CN-S-META-evidence-explanation-conclusion
  name_zh: 证据—解释—结论链
  node_type: strategy
  domain: META
  subdomain: evidence
  definition: >-
    先取得能支撑判断的文本证据，再显性说明证据与判断之间的关系，最后形成并回扣题目要求的结论。
  observable_success: >-
    在人物、主旨、情感、开放评价等不同任务中，能主动补出“为什么这个证据足以支持结论”的中间推理。
  scope_in: 多类主观阅读与短论证任务。
  scope_out: 纯记忆题；固定表面句式。
  parent_node_id: null
  gaokao_relevance: core
  status: draft
  aliases_zh: [结论证据解释回扣, 证据推理链]
  source_basis: [Project Instruction, 阅读答题总算法, 既有学习记录]
