- node_id: CN-S-diagnose-minimal-revise-check
  name_zh: 定位问题—保留原意—最小修改—复核
  node_type: strategy
  domain: LAN
  subdomain: LAN.revision
  definition: 先定位问题层级与类型，在保留原意的前提下作最小必要修改，再通读复核是否产生新问题。
  observable_success: 病句/局部作文修改中能说明问题、做必要而不过度的改动，并完成复核。
  scope_in: 句子逻辑、病句、局部表达修改。
  scope_out: 中心/结构层级重构；代写整段全文。
  parent_node_id: null
  gaokao_relevance: supporting
  status: draft
  aliases_zh: [最小修改复核]
  source_basis: [语言运用题, 作文修改训练]

- node_id: CN-S-relation-chain
  name_zh: 现象结果—关系类型—事实链—核心原因—回扣
  node_type: strategy
  domain: META
  subdomain: META.relation
  definition: 明确题目中的结果/现象，判断因果、条件、目的、转折等关系，按关系找事实并连成完整逻辑链。
  observable_success: 原因/条件/动机题中能够显性写出中间关系，不把相关事实直接并列成答案。
  scope_in: 原因分析、条件分析、情节因果、行为动机、信息类关系分析、文言原因概括。
  scope_out: 证据充分性评价；纯信息压缩。
  parent_node_id: null
  gaokao_relevance: core
  status: draft
  aliases_zh: [关系事实链]
  source_basis: [Project Instruction, 原因分析与逻辑关系训练]
